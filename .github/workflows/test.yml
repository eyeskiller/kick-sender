name: CI - Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Install Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -v ./...

      - name: Install Electron dependencies
        run: |
          cd electron
          npm ci

      - name: Build backend (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p build
          GOOS=linux GOARCH=amd64 go build -o build/kick-interval-linux ./cmd/kick-interval
          ls -lh build/

      - name: Build backend (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p build
          GOOS=darwin GOARCH=amd64 go build -o build/kick-interval-amd64 ./cmd/kick-interval
          GOOS=darwin GOARCH=arm64 go build -o build/kick-interval-arm64 ./cmd/kick-interval
          ls -lh build/
