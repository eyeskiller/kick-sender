name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-backend:
    name: Build Backend (${{ matrix.goos }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: amd64
            goos: darwin
            binary: kick-interval-darwin-amd64
          - os: macos-latest
            arch: arm64
            goos: darwin
            binary: kick-interval-darwin-arm64
          - os: ubuntu-latest
            arch: amd64
            goos: linux
            binary: kick-interval-linux-amd64
          - os: windows-latest
            arch: amd64
            goos: windows
            binary: kick-interval-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build backend
        shell: bash
        run: |
          mkdir -p build
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.arch }} go build -ldflags "-X main.version=${{ github.ref_name }}" -o build/${{ matrix.binary }} ./cmd/kick-interval

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.goos }}-${{ matrix.arch }}
          path: build/${{ matrix.binary }}

  build-electron:
    name: Build Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: kick-sender-macos
            build_cmd: npm run build:mac
          - os: windows-latest
            artifact: kick-sender-windows
            build_cmd: npm run build:win
          - os: ubuntu-latest
            artifact: kick-sender-linux
            build_cmd: npm run build:linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: electron/package-lock.json

      - name: Build backend binaries for Electron
        shell: bash
        run: |
          mkdir -p build
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
            GOOS=darwin GOARCH=amd64 go build -o build/kick-interval-amd64 ./cmd/kick-interval
            GOOS=darwin GOARCH=arm64 go build -o build/kick-interval-arm64 ./cmd/kick-interval
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            GOOS=windows GOARCH=amd64 go build -o build/kick-interval.exe ./cmd/kick-interval
          else
            GOOS=linux GOARCH=amd64 go build -o build/kick-interval-linux ./cmd/kick-interval
          fi

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools squashfs-tools desktop-file-utils

      - name: Install Electron dependencies
        shell: bash
        run: |
          cd electron
          npm ci

      - name: Build Electron app
        shell: bash
        run: |
          cd electron
          ${{ matrix.build_cmd }}

      - name: List Electron build output
        shell: bash
        run: |
          echo "--- Contents of electron/dist/ ---"
          ls -lh electron/dist/ || echo "(no dist dir)"

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: electron/dist/
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [build-backend, build-electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts for release
        shell: bash
        run: |
          mkdir -p release-assets
          # Backend binaries (single file per artifact)
          find artifacts/backend-* -maxdepth 1 -type f -exec cp {} release-assets/ \;
          # Electron installers only — skip unpacked directories
          # macOS: .dmg files (universal + arm64)
          find artifacts/kick-sender-macos -maxdepth 1 -name "*.dmg*" -type f -exec cp {} release-assets/ \;
          # Windows: NSIS installer
          find artifacts/kick-sender-windows -maxdepth 1 -name "Kick.Sender.Setup*.exe*" -type f -exec cp {} release-assets/ \;
          # Linux: AppImage
          find artifacts/kick-sender-linux -maxdepth 1 -name "*.AppImage*" -type f -exec cp {} release-assets/ \;
          echo "=== Release assets ==="
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Kick Sender ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
